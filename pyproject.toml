[project]
name = "tx-water-highland-lakes-benchmark"
version = "0.1.0"
description = "Benchmark of a fine-tuned TorchGeo U-Net against water-index thresholds for mapping the Texas Highland Lakes (Sentinel-2 + Sentinel-1), scored against two answer keys."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
    "numpy<2.4",
    "odc-stac>=0.5.3",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "planetary-computer>=1.0.0",
    "pyproj>=3.8.0",
    "pystac-client>=0.9.1",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.2",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "segmentation-models-pytorch>=0.6.0",
    "shapely>=2.2.0",
    "torch>=2.14.1",
    "torchgeo>=0.10.1",
    "torchvision>=0.29.1",
    "tqdm>=4.70.1",
]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupytext>=1.19.6",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "ruff>=0.17.5",
]

[project.scripts]
hlw = "hlw.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hlw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access (deselect with -m 'not network')"]

[tool.ruff]
line-length = 100
src = ["src"]
